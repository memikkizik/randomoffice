[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "randomoffice"
version = "0.1.0"
description = "Typed local Office document parsing foundation"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "python-pptx>=0.6.23,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
randomoffice = "randomoffice.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["randomoffice*"]
