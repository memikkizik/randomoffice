[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "randomoffice"
version = "0.1.0"
description = "Typed local Office document parsing, conversion, and queue foundation"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "python-pptx>=0.6.23,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "pywebview>=6.2.1",
    "pyinstaller>=6.22.3",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
test = [
    "pytest>=8,<9",
    "httpx>=0.28,<1",
]

[project.scripts]
randomoffice = "randomoffice.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["randomoffice*"]

[tool.setuptools.package-data]
randomoffice = [
    "static/*.html",
    "static/*.json",
    "static/*.js",
    "static/*.css",
    "static/*.svg",
    "static/*.png",
    "static/*.ico",
]
