name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies & PyInstaller
        run: uv sync --all-extras

      - name: Build Standalone EXE
        run: |
          uv run pyinstaller --clean -y RandomOffice.spec
          uv run python scripts/package_desktop.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            randomoffice/static/downloads/RandomOffice-Windows.zip
            dist/standalone/RandomOffice.exe
          draft: false
          prerelease: false
          generate_release_notes: true

